workflows:
  m3pay-android-optimized:
    name: Build m3pay Android App (Optimized)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: "3.27.0"
      xcode: "16.2"
      groups:
        - google_credentials
      vars:
        PACKAGE_NAME: "com.m3pay.app"
    scripts:
      - name: Setup and dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Build optimized APK (per ABI)
        script: |
          flutter build apk --release \
            --split-per-abi \
            --shrink \
            --obfuscate \
            --split-debug-info=./split-debug-info \
            --target-platform android-arm,android-arm64

      - name: Build optimized AppBundle
        script: |
          flutter build appbundle --release \
            --shrink \
            --obfuscate \
            --split-debug-info=./split-debug-info

      - name: Analyze build size
        script: |
          find build/app/outputs -name "*.apk" -exec ls -lh {} \;
          find build/app/outputs -name "*.aab" -exec ls -lh {} \;

    artifacts:
      - build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - build/app/outputs/bundle/release/app-release.aab
      - split-debug-info/

    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true
